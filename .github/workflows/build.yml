name: Build Vox Warp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target VoxWarp_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $src = "build/VoxWarp_artefacts/Release/VST3/Vox Warp.vst3"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $src "dist/Vox Warp.vst3"
          Copy-Item INSTALL.txt dist/
          Compress-Archive -Path "dist/*" -DestinationPath "VoxWarp-Windows-VST3.zip" -Force

      - uses: actions/upload-artifact@v5
        with:
          name: VoxWarp-Windows-VST3
          path: VoxWarp-Windows-VST3.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vox Warp v1.0 (build ${{ github.run_number }})
          files: VoxWarp-Windows-VST3.zip
          body: |
            Windows VST3 build of Vox Warp.
            Download VoxWarp-Windows-VST3.zip, unzip it, and copy "Vox Warp.vst3" to C:\Program Files\Common Files\VST3\
            Then in FL Studio: Options > Manage plugins > Find more plugins, and load Vox Warp on a mixer insert.
