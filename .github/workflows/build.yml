name: Build Vox Warp

on:
  push:
    branches: [ main, crash-repro ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64 -DVOXWARP_BUILD=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --target VoxWarp_VST3 --parallel

      - name: Validate (pluginval, full load / editor / unload cycle)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv -Force
          New-Item -ItemType Directory -Force -Path pvlogs | Out-Null
          $p = Start-Process -FilePath "pv\pluginval.exe" -ArgumentList '--strictness-level','5','--validate-in-process','--timeout-ms','300000','--output-dir','pvlogs','"build/VoxWarp_artefacts/Release/VST3/Vox Warp.vst3"' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; Write-Error "pluginval hung (freeze)"; exit 1 }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          Get-ChildItem pvlogs -Recurse | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pluginval-logs
          path: pvlogs

      - name: Package
        shell: pwsh
        run: |
          $src = "build/VoxWarp_artefacts/Release/VST3/Vox Warp.vst3"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $src "dist/Vox Warp.vst3"
          Copy-Item INSTALL.txt dist/
          Compress-Archive -Path "dist/*" -DestinationPath "VoxWarp-Windows-VST3.zip" -Force

      - uses: actions/upload-artifact@v5
        with:
          name: VoxWarp-Windows-VST3
          path: VoxWarp-Windows-VST3.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vox Warp v1.0 (build ${{ github.run_number }})
          files: VoxWarp-Windows-VST3.zip
          body: |
            Windows VST3 build of Vox Warp.
            Download VoxWarp-Windows-VST3.zip, unzip it, and copy "Vox Warp.vst3" to C:\Program Files\Common Files\VST3\
            Then in FL Studio: Options > Manage plugins > Find more plugins, and load Vox Warp on a mixer insert.
